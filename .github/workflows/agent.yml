name: Autonomous Agent Runner

on:
  schedule:
    - cron: '0 * * * *'  # يعمل تلقائياً كل ساعة
  workflow_dispatch:      # يتيح لك تشغيله يدوياً من موقع جيت هاب متى شئت

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Daemon Agent
        run: node daemon-agent.js
        env:
          NODE_ENV: production
