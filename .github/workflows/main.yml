name: Autonomous Agent Runner

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Daemon Agent
        run: node daemon-agent.js
        env:
          NODE_ENV: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Agent Changes (Self-Evolve)
        run: |
          git config --global user.name "Termux-Token Autonomous Agent"
          git config --global user.email "agent@users.noreply.github.com"
          git status
          git add .
          git diff --staged --quiet || git commit -m "🤖 Autonomous Agent: Self-evolution and automated updates [skip ci]"
          git push
